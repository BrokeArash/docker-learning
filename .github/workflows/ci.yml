name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      DB_NAME: task_manager
      DB_USER: task_user
      DB_PASSWORD: task_password

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker images
        run: docker compose build

      - name: Start services
        run: docker compose up -d

      - name: Wait for backend
        run: |
          for i in {1..30}; do
            if curl --fail http://localhost:8080/api/tasks; then
              echo "Backend is ready"
              exit 0
            fi

            echo "Waiting for backend..."
            sleep 2
          done

          echo "Backend did not become ready"
          docker compose ps
          docker compose logs
          exit 1

      - name: Test API
        run: |
          curl --fail http://localhost:8080/api/tasks

      - name: Push Docker images
        run: |
          docker tag docker-learning-backend ghcr.io/brokearash/docker-learning-backend:latest
          docker tag docker-learning-frontend ghcr.io/brokearash/docker-learning-frontend:latest

          docker push ghcr.io/brokearash/docker-learning-backend:latest
          docker push ghcr.io/brokearash/docker-learning-frontend:latest
